# Benchmark runs: local Qwen3.8-27B-FP8 (vLLM on :8002, 256k context, tool-call
# parser and reasoning parser enabled). The cache is separate from the old
# Magpie runs, so every record stays attributable to one model.
#
# 2026-11-18: switched from auto/deepseek-v4.1-flash @ :3425. Score history and
# reports produced before this date were generated by that Magpie model.
llm:
  model: Qwen3.8-27B-FP8
  api_key_env: QWEN_API_KEY
  base_url: http://127.0.0.1:8002/v1
  temperature: 0.0
  cache_dir: .cache/llm-bench-qwen38
  # Qwen3.8 reasons by default.  On a 25-card semantic prompt that ran past
  # the client's timeout; the same request answers in 18s with thinking off.
  # Applied to structured (JSON) calls only.
  json_extra_body:
    chat_template_kwargs:
      enable_thinking: false
device:
  serial: emulator-5600
  timeout_s: 30
# The GUI agent that executes a plan's description. It is the same local model
# as the planner until the ablation (Task H) compares arms.
agent:
  model: Qwen3.8-27B-FP8
  fallback_model: Qwen3.8-27B-FP8
  max_steps: 20
paths:
  root: runs/mobileworld/work
  cards: cards
  graph: graph
  traces: traces
  runs: runs
  state: state
  completion: completion
