[project]
name = "specfcg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "openai>=1.60"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
device = ["uiautomator2>=3.0"]

[project.scripts]
specfcg = "specfcg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
