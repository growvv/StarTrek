# Released versions, newest first. The site's releases page and the "latest
# release" badge on the index both read this file, and `scripts/release.py`
# appends to it, so the page never drifts from the git tag.
#
# Fields:
#   tag      git tag; must exist on origin before the page is published
#   version  human-facing version, also used as the section anchor
#   date     ISO date of the release
#   title    one line, shown as the heading
#   summary  two or three sentences; what a reader gets from this version
#   highlights  bullet points, each a complete sentence
#   evidence   paths under docs/ that back the claims (may be empty)

releases:
  - tag: v0.4.0
    version: 0.4.0
    date: 2026-11-19
    title: 重建四个图，消融没有测出图的增量
    summary: >-
      卡片契约化之后重建四个图，并在新图上做了图描述与原始 goal 的配对消融。
      结果必须如实读：20 个任务里 18 个两臂结论相同，配对差异 -1，
      任务描述没有表现出比用户原话更好的效果。
    highlights:
      - 四图已用当前 builder 从同一批轨迹重建：25/21/18/17 张卡片，每图一次语义边调用。
      - 重复功能改为在语义边同一次调用里读契约判断，只报告不评分、不自动合并。
      - 两臂消融：图描述 12/20，原始 goal 13/20，配对差异 -1。
      - 唯一差异来自图缺一条边（add_note_to_current_activity 无入边），不是描述质量的证据。
      - 修复：Qwen 的 reasoning 会让大 JSON 提示超时，结构化请求可配置关闭 thinking（25 卡语义调用从超时降到 18 秒）。
      - 440 个测试通过，CI 在干净环境（无 Pillow / 无 adb / 无 runs）下通过。
    evidence:
      - docs/reports/mobileworld.html
      - docs/handoff.md
  - tag: v0.3.0
    version: 0.3.0
    date: 2026-11-18
    title: 探针与能力补全走 agent
    summary: >-
      能力补全不再依赖预先写好的探针脚本：一个能力假设被渲染成任务描述，
      交给同一个 GUI agent 去尝试，它看到什么就做什么。
    highlights:
      - 探针经 AgentProbe 交给 agent，与 benchmark 执行器是同一个客户端。
      - 修复：探针计划漏传包名，agent 会在错误的 app 上行动；已加回归测试。
      - 能力假设只写意图与前后置条件，不再让模型预先猜控件。
      - 真机验证：探针任务六步执行，每步带动作前 UI，trace 记录最终状态。
      - 419 个测试通过。
    evidence:
      - docs/handoff.md
  - tag: v0.2.0
    version: 0.2.0
    date: 2026-11-18
    title: 卡片是契约，计划是描述，agent 执行
    summary: >-
      架构切换：卡片不再记录 UI 动作，只声明意图、输入、前后置条件与产出；
      规划器的输出变成一段任务描述，由 GUI agent 执行。图从此描述 App 的功能，
      而不是回放某一次录制的动作。
    highlights:
      - 卡片去掉 Steps；解析器显式拒绝旧格式，93 张卡已迁移且幂等。
      - 新增 TaskDescriber：确定性渲染整体 goal 与有序 subgoals，不点名任何动作。
      - 新增 GuiAgent 协议与 MobileAgentBackend；Executor 只交描述、只做 goal 判定。
      - agent 不再自己启动 app，不再清掉 benchmark 准备好的状态。
      - 删除 StepCompiler / PlanStep / DeviceProbe / execute_plan / SpecFCGAgent / granularity。
      - 真机验证：MobileAgentBackend 逐步记录动作前后 UI；规划→描述→执行→判定返回成功。
      - 417 个测试通过。
    evidence:
      - docs/handoff.md
      - docs/superpowers/specs/2026-11-10-spec-fcg-mobile-gui-testing-design.md
  - tag: v0.1.0
    version: 0.1.0
    date: 2026-11-18
    title: Stage 1 MVP 与实验环境
    summary: >-
      第一个可运行版本：从真实轨迹归纳 function card、建 Function Contract
      Graph、按目标规划并在真机上执行，失败后回写卡片。实验侧补齐了四个 App 的
      MobileWorld 基准、随机遍历对照与分数记录；本机实验环境改为 Android 模拟器 +
      本地 vLLM 的 Qwen3.8-27B。
    highlights:
      - 卡片、图、规划、执行、修补的完整链路在真机上验证，三个组合目标 3/3 通过。
      - 448 个离线测试通过，CI 覆盖 Python 3.10 与 3.12。
      - 四个 App 各建一张图，分数记录 7 次迭代，最新综合 71.7。
      - 实验环境迁到 Android 模拟器；LLM 从 Magpie 网关切到本地 Qwen3.8-27B（256k 上下文、OpenAI 工具调用）。
      - 已知限制写进报告：20 个任务不足以做显著性结论，标定维度是 bias-only。
    evidence:
      - docs/reports/mobileworld.html
      - docs/evidence/README.md
      - docs/experiments/2026-11-10-real-device-pilot.md
